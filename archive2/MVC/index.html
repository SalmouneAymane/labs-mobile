<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>MVC</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #0f172a; color: #f8fafc; font-family: Inter, system-ui, sans-serif; }
        header { min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 20px; background: #111c30; }
        header a { color: #7dd3fc; text-decoration: none; }
        header a:hover, header a:focus-visible { text-decoration: underline; }
        nav { display: flex; gap: 18px; }
        iframe { display: block; width: 100%; height: calc(100vh - 54px); border: 0; }
        @media (max-width: 520px) { header { align-items: flex-start; flex-direction: column; } nav { flex-wrap: wrap; } iframe { height: calc(100vh - 82px); } }
    </style>
</head>

    <header>
        <a href="../index.html">← All presentations</a>
        <nav aria-label="Presentation actions">
            <a href="presentation.html" target="_blank" rel="noopener">Open slides in a new tab</a>

        </nav>

    <iframe src="presentation.html" title="MVC presentation" allowfullscreen></iframe>
